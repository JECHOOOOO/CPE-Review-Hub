name: Build and test COLMS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore application
        run: dotnet restore CPE-Review-Hub.csproj
      - name: Build release application
        run: dotnet build CPE-Review-Hub.csproj --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test CPE-Review-Hub.Tests/CPE-Review-Hub.Tests.csproj --configuration Release
      - name: Publish deployment artifact
        run: dotnet publish CPE-Review-Hub.csproj --configuration Release --no-build --output publish
